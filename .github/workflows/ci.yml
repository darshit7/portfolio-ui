name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # Pinned rather than read from .nvmrc, which is gitignored and so
          # never exists in the CI checkout. Keep in sync with .nvmrc (24).
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each of these runs contentlayer first, so they must not be parallelised.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Runs against `pnpm serve`, started by playwright.config.ts webServer.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
